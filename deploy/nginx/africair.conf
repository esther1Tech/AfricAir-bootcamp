# JSON access log, one object per request (parsed by report.sh with jq).
log_format africair_json escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
  '"request_method":"$request_method","uri":"$uri","status":$status,'
  '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"http_referer":"$http_referer","http_user_agent":"$http_user_agent"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/africair/current;
    index index.html;
    server_tokens off;

    access_log /var/log/nginx/africair.access.json africair_json;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # Health endpoint: not logged, so monitoring doesn't fill the log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include snippets/africair-security-headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok";
    }

    # Always revalidate the entry point and the version file.
    location = /index.html {
        include snippets/africair-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /version.json {
        include snippets/africair-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Hashed files never change: cache for a year.
    location /assets/ {
        include snippets/africair-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (e.g. /africair-mark.svg). Unknown paths are a real 404.
    location / {
        include snippets/africair-security-headers.conf;
        try_files $uri $uri/ =404;
    }

    # API proxy (location /api/) is added in B8.
}
